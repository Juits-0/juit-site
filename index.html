<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="color-scheme" content="dark">
  <title>JUIT — Mobu & oyun laboratuvarı</title>
  <meta name="description" content="Oyunların arkasındaki mekanikler, Mobu ile anlatılan videolar ve oynanabilir deneyler.">
  <link rel="canonical" href="https://juitexe.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JUIT">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:url" content="https://juitexe.com/">
  <meta property="og:title" content="JUIT — Mobu &amp; oyun laboratuvarı">
  <meta property="og:description" content="Oyunların arkasındaki mekanikler, Mobu ile anlatılan videolar ve oynanabilir deneyler.">
  <meta property="og:image" content="https://juitexe.com/logo/jt_logo.png">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/InterDisplay-Black.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <a class="skip-link" href="#main">İçeriğe atla</a>

  <!-- Açılış: siyah perde + logo. JS başarısız olursa CSS fallback ile 2.5 sn sonra kaybolur. -->
  <div id="intro" class="intro">
    <canvas id="intro-canvas" class="intro__canvas" aria-hidden="true"></canvas>
    <button id="intro-skip" class="intro__skip" type="button">Atla <kbd>Esc</kbd></button>
  </div>

  <!-- Kalıcı üst çubuk -->
  <header id="topbar" class="topbar" hidden>
    <a class="topbar__brand" href="#/" aria-label="JUIT ana sayfa"><img src="/logo/jt_logo.png" alt="" width="34" height="34"><span>JUIT</span></a>
    <nav id="topbar-nav" class="topbar__nav" aria-label="Site gezinmesi">
      <a href="#/mobu" data-route="mobu">Mobu & Videolar</a>
      <a href="#/arcade" data-route="arcade">Oyun Salonu</a>
      <a href="#/lab" data-route="lab">Deneyler</a>
      <a href="#/about" data-route="about">Hakkımda</a>
    </nav>
    <div class="topbar__tools">
      <button id="sfx-toggle" class="icon-btn" type="button" aria-pressed="false" title="Ses efektleri"><span class="icon-btn__ico" aria-hidden="true">🔇</span><span class="sr-only">Ses efektleri</span></button>
      <button id="menu-toggle" class="icon-btn icon-btn--menu" type="button" aria-expanded="false" aria-controls="topbar-nav" title="Menü"><span aria-hidden="true">☰</span><span class="sr-only">Menü</span></button>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1"></main>

  <!-- Mobu canvas katmanı: tıklama geçirgen; sadece Mobu'nun kendisi için küçük bir hedef var -->
  <canvas id="mobu-layer" class="mobu-layer" aria-hidden="true"></canvas>
  <button id="mobu-hit" class="mobu-hit" type="button" aria-label="Mobu" hidden></button>

  <!-- Modal (video / oyun / gizli çekmece) -->
  <div id="modal" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__frame" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal__head">
        <h2 id="modal-title" class="modal__title"></h2>
        <div class="modal__actions"></div>
        <button class="icon-btn modal__close" type="button" data-close aria-label="Kapat"><span aria-hidden="true">✕</span></button>
      </div>
      <div class="modal__body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/src/main.js"></script>
  <noscript><style>.intro{display:none}#topbar{display:flex}</style><p class="noscript">Bu site JavaScript ile çalışır. Videolar: <a href="https://juit.itch.io/">itch.io</a></p></noscript>
</body>
</html>
